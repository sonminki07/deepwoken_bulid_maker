<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deepwoken AI Build Assistant & Hub</title>
  <!-- Tailwind CSS & Marked.js for Markdown Rendering -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
    
    /* Markdown Styles */
    .prose h1, .prose h2, .prose h3 { color: #38bdf8; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
    .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
    .prose ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.75rem; }
    .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
    .prose th, .prose td { border: 1px solid #334155; padding: 6px 12px; text-align: left; }
    .prose th { background-color: #1e293b; color: #38bdf8; }
    .prose pre { background-color: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155; margin: 0.75rem 0; }
    .prose code { color: #f43f5e; background-color: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    .prose pre code { color: #f8fafc; background: none; padding: 0; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 flex h-screen overflow-hidden select-text">

  <!-- 좌측 사이드바: 빌드 목록 및 동기화 -->
  <aside class="w-80 bg-[#111827] border-r border-slate-800 flex flex-col justify-between shrink-0">
    <!-- 상단 헤더 -->
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-sky-600/20 border border-sky-500/30 flex items-center justify-center text-sky-400 font-bold">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-wide text-white">Deepwoken AI Hub</h1>
          <p class="text-xs text-slate-400">RAG AI Build Advisor</p>
        </div>
      </div>
      <button onclick="syncGitHub()" id="syncBtn" class="px-2.5 py-1.5 bg-sky-600/20 hover:bg-sky-600/30 text-sky-400 border border-sky-500/30 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all">
        <i class="fa-solid fa-arrows-rotate" id="syncIcon"></i> 동기화
      </button>
    </div>

    <!-- 탭 전환 -->
    <div class="px-4 pt-3 flex gap-2 border-b border-slate-800 pb-3">
      <button onclick="switchTab('chat')" id="tabChat" class="flex-1 py-2 rounded-lg text-xs font-bold bg-sky-600 text-white flex items-center justify-center gap-1.5 transition-all">
        <i class="fa-solid fa-comments"></i> AI 대화
      </button>
      <button onclick="switchTab('builds')" id="tabBuilds" class="flex-1 py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition-all">
        <i class="fa-solid fa-scroll"></i> 빌드 보관함 (<span id="buildCount">0</span>)
      </button>
    </div>

    <!-- 빌드 목록 (사이드바 리스트) -->
    <div class="flex-1 overflow-y-auto p-3 space-y-2" id="buildList">
      <div class="text-xs text-slate-500 p-2 text-center">빌드 데이터를 불러오는 중...</div>
    </div>

    <!-- 사이드바 하단 정보 -->
    <div class="p-3 border-t border-slate-800 bg-[#0d131f] text-xs text-slate-400 flex justify-between items-center">
      <span><i class="fa-brands fa-discord text-[#5865F2]"></i> 디스코드 봇 연동 중</span>
      <span class="text-emerald-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online</span>
    </div>
  </aside>

  <!-- 우측 메인 영역 -->
  <main class="flex-1 flex flex-col bg-[#0b0f19] overflow-hidden relative">

    <!-- 1. AI 챗봇 화면 (Chat View) -->
    <section id="chatSection" class="flex-1 flex flex-col overflow-hidden">
      <!-- 채팅 메시지 영역 -->
      <div class="flex-1 overflow-y-auto p-6 space-y-6" id="chatContainer">
        <!-- AI 환영 메시지 -->
        <div class="flex gap-4 max-w-4xl">
          <div class="w-8 h-8 rounded-full bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-sky-400 shrink-0">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div class="bg-[#161f30] border border-slate-800 rounded-2xl rounded-tl-none p-4 max-w-2xl text-sm leading-relaxed prose">
            <h3 class="!mt-0">⚔️ Deepwoken AI 빌드 어드바이저에 오신 것을 환영합니다!</h3>
            <p>디스코드나 웹에서 수집된 모든 최신 빌드, 1,139개 탤런트, 14개 카테고리 위키 데이터를 바탕으로 질문에 답해 드립니다.</p>
            <p class="text-xs text-slate-400 !mb-0">장문의 스탯 정보나 복잡한 요구사항(예: 특정 무기 고정, 만트라 추천, 방어구 세팅 등)을 자유롭게 물어보세요.</p>
          </div>
        </div>
      </div>

      <!-- 추천 질문 칩 -->
      <div class="px-6 py-2 flex gap-2 overflow-x-auto shrink-0" id="suggestedChips">
        <button onclick="setPrompt('Galebreathe(바람) 젯스트라이커 추천 장비와 스펙터 콤보 알려줘')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-sky-300 px-3 py-1.5 rounded-full border border-slate-700 whitespace-nowrap transition-all">
          🌪️ 젯스트라이커 100 Gale 장비 & 콤보
        </button>
        <button onclick="setPrompt('Frostdraw(빙결) 빌드에서 절대 버리면 안 되는 필수 탤런트 4개 정리해줘')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-sky-300 px-3 py-1.5 rounded-full border border-slate-700 whitespace-nowrap transition-all">
          ❄️ Frostdraw 필수 탤런트 분석
        </button>
        <button onclick="setPrompt('현재 Verse 2 메타에서 S티어 Oath와 무기 티어리스트 브리핑해줘')" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-sky-300 px-3 py-1.5 rounded-full border border-slate-700 whitespace-nowrap transition-all">
          🏆 S티어 메타 티어리스트
        </button>
      </div>

      <!-- 입력창 영역 (장문 / 다중 줄 지원) -->
      <div class="p-4 bg-[#111827] border-t border-slate-800">
        <div class="max-w-4xl mx-auto flex gap-3 items-end">
          <div class="flex-1 bg-[#1e293b] rounded-2xl border border-slate-700 focus-within:border-sky-500 transition-all p-2 flex flex-col">
            <textarea id="chatInput" rows="2" placeholder="질문이나 스탯 정보를 자유롭게 입력하세요... (Enter로 전송, Shift+Enter로 줄바꿈)" 
              class="bg-transparent text-sm text-slate-100 placeholder-slate-500 focus:outline-none resize-none px-2 py-1 max-h-48 overflow-y-auto"></textarea>
          </div>
          <button onclick="sendChatMessage()" id="sendBtn" class="h-12 w-12 rounded-2xl bg-sky-600 hover:bg-sky-500 text-white font-bold flex items-center justify-center shrink-0 transition-all shadow-lg shadow-sky-600/20">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- 2. 빌드 뷰어 화면 (Build Viewer View) -->
    <section id="buildSection" class="flex-1 flex flex-col overflow-y-auto p-6 hidden">
      <div class="max-w-4xl mx-auto w-full space-y-6" id="buildDetailContainer">
        <div class="p-8 text-center text-slate-500">
          좌측 사이드바에서 보고 싶은 빌드를 선택하세요.
        </div>
      </div>
    </section>

  </main>

  <!-- JavaScript Interaction Logic -->
  <script>
    let currentBuilds = [];
    let activeTab = 'chat';

    // 1. 초기 로드
    window.addEventListener('DOMContentLoaded', () => {
      fetchBuilds();
      
      const input = document.getElementById('chatInput');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendChatMessage();
        }
      });
    });

    // 2. 탭 전환
    function switchTab(tab) {
      activeTab = tab;
      const chatSec = document.getElementById('chatSection');
      const buildSec = document.getElementById('buildSection');
      const tabChat = document.getElementById('tabChat');
      const tabBuilds = document.getElementById('tabBuilds');

      if (tab === 'chat') {
        chatSec.classList.remove('hidden');
        buildSec.classList.add('hidden');
        tabChat.className = 'flex-1 py-2 rounded-lg text-xs font-bold bg-sky-600 text-white flex items-center justify-center gap-1.5 transition-all';
        tabBuilds.className = 'flex-1 py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition-all';
      } else {
        chatSec.classList.add('hidden');
        buildSec.classList.remove('hidden');
        tabBuilds.className = 'flex-1 py-2 rounded-lg text-xs font-bold bg-sky-600 text-white flex items-center justify-center gap-1.5 transition-all';
        tabChat.className = 'flex-1 py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition-all';
      }
    }

    // 3. 빌드 목록 가져오기
    async function fetchBuilds() {
      try {
        const res = await fetch('/api/builds');
        const data = await res.json();
        currentBuilds = data.builds || [];
        document.getElementById('buildCount').textContent = currentBuilds.length;
        renderSidebarBuilds();
      } catch (e) {
        console.error("Failed to fetch builds:", e);
      }
    }

    // 4. 사이드바 렌더링
    function renderSidebarBuilds() {
      const container = document.getElementById('buildList');
      if (currentBuilds.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-500 p-4 text-center">아직 분석된 빌드가 없습니다.<br>디스코드나 상단 동기화를 사용하세요.</div>`;
        return;
      }

      container.innerHTML = currentBuilds.map(b => `
        <div onclick="selectBuild('${b.id}')" class="p-3 bg-[#1e293b]/60 hover:bg-[#1e293b] border border-slate-800 hover:border-sky-500/50 rounded-xl cursor-pointer transition-all group">
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-bold text-sm text-slate-200 group-hover:text-sky-400 transition-colors line-clamp-1">${b.name}</h4>
            <span class="px-2 py-0.5 text-[10px] rounded bg-sky-500/10 text-sky-400 border border-sky-500/20 font-semibold">${b.type}</span>
          </div>
          <p class="text-xs text-slate-400 line-clamp-1">작성자: ${b.author} • ${b.difficulty}</p>
        </div>
      `).join('');
    }

    // 5. 빌드 선택 및 상세 뷰어 렌더링
    function selectBuild(buildId) {
      const build = currentBuilds.find(b => b.id === buildId);
      if (!build) return;

      switchTab('builds');
      const data = build.data;
      const summary = data.build_summary || {};
      const stats = data.stats_and_attunements || {};
      const attrs = stats.attributes || {};
      const talents = data.talents_and_mantras?.core_talents || [];
      const mantras = data.talents_and_mantras?.core_mantras || [];
      const combo = data.combo_and_playstyle || {};

      const detailHtml = `
        <div class="bg-[#161f30] border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
          <div class="flex justify-between items-start border-b border-slate-800 pb-4">
            <div>
              <span class="px-2.5 py-1 text-xs font-bold rounded bg-sky-500/20 text-sky-400 border border-sky-500/30">${summary.build_type || 'Hybrid'}</span>
              <h2 class="text-2xl font-extrabold text-white mt-2">${summary.build_name || build.name}</h2>
              <p class="text-xs text-slate-400 mt-1">작성자: <span class="text-slate-200 font-semibold">${summary.author || 'Unknown'}</span> | 난이도: ${summary.difficulty || 'Intermediate'}</p>
            </div>
            <button onclick="copyInjectCode('${build.id}')" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center gap-2 transition-all shadow-lg shadow-emerald-600/20">
              <i class="fa-solid fa-code"></i> deepwoken.co 주입 코드 복사
            </button>
          </div>

          <!-- 스탯 그리드 -->
          <div>
            <h3 class="text-sm font-bold text-sky-400 mb-3 flex items-center gap-2"><i class="fa-solid fa-chart-simple"></i> 스탯 분배 (Attributes)</h3>
            <div class="grid grid-cols-6 gap-2 text-center text-xs">
              <div class="bg-[#0f172a] p-2.5 rounded-lg border border-slate-800"><p class="text-slate-400">STR</p><p class="text-base font-bold text-white mt-1">${attrs.strength || 0}</p></div>
              <div class="bg-[#0f172a] p-2.5 rounded-lg border border-slate-800"><p class="text-slate-400">FTD</p><p class="text-base font-bold text-white mt-1">${attrs.fortitude || 0}</p></div>
              <div class="bg-[#0f172a] p-2.5 rounded-lg border border-slate-800"><p class="text-slate-400">AGL</p><p class="text-base font-bold text-white mt-1">${attrs.agility || 0}</p></div>
              <div class="bg-[#0f172a] p-2.5 rounded-lg border border-slate-800"><p class="text-slate-400">INT</p><p class="text-base font-bold text-white mt-1">${attrs.intelligence || 0}</p></div>
              <div class="bg-[#0f172a] p-2.5 rounded-lg border border-slate-800"><p class="text-slate-400">WLL</p><p class="text-base font-bold text-white mt-1">${attrs.willpower || 0}</p></div>
              <div class="bg-[#0f172a] p-2.5 rounded-lg border border-slate-800"><p class="text-slate-400">CHA</p><p class="text-base font-bold text-white mt-1">${attrs.charisma || 0}</p></div>
            </div>
          </div>

          <!-- 탤런트 및 만트라 -->
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
              <h4 class="text-xs font-bold text-amber-400 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-star"></i> 핵심 탤런트</h4>
              <ul class="text-xs space-y-1 text-slate-300">
                ${talents.map(t => `<li class="flex items-center gap-1.5"><i class="fa-solid fa-check text-emerald-400 text-[10px]"></i> ${t}</li>`).join('')}
              </ul>
            </div>
            <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
              <h4 class="text-xs font-bold text-purple-400 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles"></i> 핵심 만트라(주문)</h4>
              <ul class="text-xs space-y-1 text-slate-300">
                ${mantras.map(m => `<li class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-purple-400 text-[10px]"></i> ${m}</li>`).join('')}
              </ul>
            </div>
          </div>

          <!-- 콤보 & 가이드 -->
          <div class="bg-[#0f172a] p-4 rounded-xl border border-slate-800">
            <h4 class="text-xs font-bold text-sky-400 mb-2 flex items-center gap-1.5"><i class="fa-solid fa-gamepad"></i> 콤보 & 전투 운용 가이드</h4>
            <p class="text-xs text-slate-300 leading-relaxed">${combo.combo_guide || '추출된 콤보 가이드가 없습니다.'}</p>
          </div>
        </div>
      `;
      document.getElementById('buildDetailContainer').innerHTML = detailHtml;
    }

    // 6. 주입 코드 복사
    function copyInjectCode(buildId) {
      const build = currentBuilds.find(b => b.id === buildId);
      if (!build) return;

      const jsCode = `// Deepwoken Builder 자동 주입 코드 (F12 콘솔에 붙여넣기)\nconst myBuild = ${JSON.stringify(build.data, null, 2)};\nlocalStorage.setItem('dwb-active-build', JSON.stringify(myBuild));\nlocalStorage.setItem('dw-builder-save', JSON.stringify(myBuild));\nlocation.reload();`;
      navigator.clipboard.writeText(jsCode);
      alert('deepwoken.co/builder 콘솔 주입용 코드가 클립보드에 복사되었습니다!\n사이트에서 F12 -> Console 탭에 붙여넣기(Ctrl+V) 후 엔터를 누르세요.');
    }

    // 7. GitHub 클라우드 동기화 (Git Pull)
    async function syncGitHub() {
      const icon = document.getElementById('syncIcon');
      icon.classList.add('fa-spin');
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        const data = await res.json();
        await fetchBuilds();
        alert('🎉 GitHub 클라우드의 모든 최신 빌드 데이터가 내 컴퓨터로 동기화되었습니다!');
      } catch (e) {
        alert('동기화 실패: ' + e);
      } finally {
        icon.classList.remove('fa-spin');
      }
    }

    // 8. 챗봇 프롬프트 칩 설정
    function setPrompt(text) {
      const input = document.getElementById('chatInput');
      input.value = text;
      input.focus();
    }

    // 9. AI 챗봇 메시지 전송
    async function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      const container = document.getElementById('chatContainer');

      // 사용자 메시지 추가
      container.innerHTML += `
        <div class="flex gap-4 max-w-4xl ml-auto justify-end">
          <div class="bg-sky-600 text-white rounded-2xl rounded-tr-none p-4 max-w-2xl text-sm leading-relaxed whitespace-pre-wrap shadow-md">
            ${escapeHtml(message)}
          </div>
          <div class="w-8 h-8 rounded-full bg-sky-600 flex items-center justify-center text-white shrink-0 font-bold text-xs">
            ME
          </div>
        </div>
      `;

      // AI 로딩 스피너 추가
      const loadingId = 'loading-' + Date.now();
      container.innerHTML += `
        <div id="${loadingId}" class="flex gap-4 max-w-4xl">
          <div class="w-8 h-8 rounded-full bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-sky-400 shrink-0">
            <i class="fa-solid fa-robot animate-pulse"></i>
          </div>
          <div class="bg-[#161f30] border border-slate-800 rounded-2xl rounded-tl-none p-4 max-w-2xl text-sm text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-circle-notch fa-spin text-sky-400"></i> 빌드 데이터베이스 검색 및 답변 작성 중...
          </div>
        </div>
      `;
      container.scrollTop = container.scrollHeight;

      // API 호출
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });
        const data = await res.json();
        document.getElementById(loadingId).remove();

        const replyHtml = marked.parse(data.reply || data.error || '답변을 불러오지 못했습니다.');
        container.innerHTML += `
          <div class="flex gap-4 max-w-4xl">
            <div class="w-8 h-8 rounded-full bg-sky-500/20 border border-sky-500/40 flex items-center justify-center text-sky-400 shrink-0">
              <i class="fa-solid fa-robot"></i>
            </div>
            <div class="bg-[#161f30] border border-slate-800 rounded-2xl rounded-tl-none p-4 max-w-2xl text-sm leading-relaxed prose shadow-lg">
              ${replyHtml}
            </div>
          </div>
        `;
      } catch (e) {
        document.getElementById(loadingId).remove();
        container.innerHTML += `
          <div class="flex gap-4 max-w-4xl">
            <div class="w-8 h-8 rounded-full bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400 shrink-0">
              <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <div class="bg-rose-950/40 border border-rose-800/50 rounded-2xl rounded-tl-none p-4 max-w-2xl text-sm text-rose-300">
              서버 오류: ${e}
            </div>
          </div>
        `;
      }
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>
</body>
</html>
