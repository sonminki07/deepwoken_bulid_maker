name: Deepwoken Issue-Based Continuous Analyzer

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

# 동시 충돌 방지: 동일 이슈 또는 브랜치 작업 순차 큐잉
concurrency:
  group: cloud-build-worker
  cancel-in-progress: false

jobs:
  analyze_from_issue:
    # 봇 자신이 작성한 댓글 루프 방지
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'issues' || contains(github.event.comment.body, 'http'))
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 FFmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📦 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pydantic yt-dlp python-dotenv rich chromadb beautifulsoup4 pyyaml imageio-ffmpeg

      - name: 🔍 Issue 내용에서 URL 추출 및 분석 실행
        id: run_analysis
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          python -c "
          import os, re, sys
          from pipeline.orchestrator import BuildPipelineOrchestrator
          from pipeline.web_orchestrator import WebPipelineOrchestrator

          keys = os.getenv('GEMINI_API_KEYS') or os.getenv('GEMINI_API_KEY')
          if not keys:
              print('⚠️ [경고] GEMINI_API_KEYS 시크릿이 설정되지 않았습니다!')
              with open('result_summary.txt', 'w', encoding='utf-8') as f:
                  f.write('⚠️ **오류**: 저장소 [Settings] -> [Secrets and variables] -> [Actions] 에 `GEMINI_API_KEYS` 시크릿을 등록해 주세요.')
              sys.exit(0)

          text = (os.getenv('ISSUE_TITLE', '') + '\n' + os.getenv('ISSUE_BODY', ''))
          urls = re.findall(r'https?://[^\s\)\"\']+', text)
          urls = [u.rstrip('.,;\"\'') for u in urls if any(k in u.lower() for k in ['youtube', 'youtu.be', 'docs.google.com', 'deepwoken'])]
          
          if not urls:
              print('❌ 유효한 유튜브/구글닥스/위키 URL을 찾지 못했습니다.')
              with open('result_summary.txt', 'w', encoding='utf-8') as f:
                  f.write('❌ 유효한 유튜브/구글닥스/위키 URL을 찾지 못했습니다. 본문에 정확한 링크를 적어주세요.')
              sys.exit(0)

          print(f'🎯 발견된 URL {len(urls)}개 분석 시작: {urls}')

          video_orc = BuildPipelineOrchestrator()
          web_orc = WebPipelineOrchestrator()

          results = []
          for u in urls:
              try:
                  if 'youtube.com' in u or 'youtu.be' in u:
                      res = video_orc.process_url(u)
                      results.append(f'✅ **유튜브 영상 분석 완료**: [{res.get(\"build_summary\", {}).get(\"build_name\", \"Build\")}]({u})')
                  else:
                      res = web_orc.process_url(u)
                      results.append(f'✅ **웹/문서 가이드 분석 완료**: [{res.get(\"build_summary\", {}).get(\"build_name\", \"Build\")}]({u})')
              except Exception as e:
                  results.append(f'❌ **분석 오류**: {u} (사유: {e})')

          with open('result_summary.txt', 'w', encoding='utf-8') as f:
              f.write('\n\n'.join(results))
          "

      - name: 💾 결과 자동 커밋 및 충돌 방지 푸시 (Rebase Retry)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Deepwoken Cloud Bot"
          git add data/analysis/ data/knowledge_base/ data/queue.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Issue Auto] Issue #${{ github.event.issue.number }} 분석 결과 저장"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              git push origin main && break || sleep 3
            done
          else
            echo "변경 사항 없음."
          fi

      - name: 💬 Issue에 분석 완료 댓글 작성 및 자동 완료 닫기
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = "빌드 분석이 완료되었습니다!";
            if (fs.existsSync('result_summary.txt')) {
              summary = fs.readFileSync('result_summary.txt', 'utf8');
            }
            const issueNumber = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### ⚡ Deepwoken AI 빌드 분석 결과\n\n${summary}\n\n📁 결과 파일이 저장소의 \`data/analysis/\` 및 \`data/knowledge_base/\` 에 저장되었습니다.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed'
            });
