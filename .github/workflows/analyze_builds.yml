name: Deepwoken Cloud Build Analyzer

on:
  workflow_dispatch:
    inputs:
      urls:
        description: '분석할 유튜브/구글닥스/웹 URL (여러 개인 경우 줄바꿈 또는 쉼표로 구분)'
        required: true
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: cloud-build-worker
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🎬 FFmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📦 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pydantic yt-dlp python-dotenv rich chromadb beautifulsoup4 pyyaml imageio-ffmpeg

      - name: 🚀 Deepwoken 빌드 클라우드 분석 실행
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_URLS: ${{ github.event.inputs.urls }}
        run: |
          python -c "
          import os, sys
          from agents.queue_manager import QueueManager

          raw_urls = os.getenv('INPUT_URLS', '')
          urls = [u.strip() for u in raw_urls.replace(',', '\n').splitlines() if u.strip()]

          qm = QueueManager()
          if urls:
              print(f'📥 등록된 URL {len(urls)}개 대기열 추가 중...')
              qm.add_urls(urls)

          print('⚡ 클라우드 대기열 분석 작업자 실행...')
          qm.run_worker(interval_seconds=3, continuous=False)
          "

      - name: 💾 분석된 빌드 JSON 및 지식 문서 자동 커밋 & 푸시 (Rebase Retry)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Deepwoken Cloud Bot"
          git add data/analysis/ data/knowledge_base/ data/queue.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 [Cloud Auto] Deepwoken 빌드 분석 및 지식 베이스 갱신"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              git push origin main && break || sleep 3
            done
          else
            echo "변경 사항 없음."
          fi
