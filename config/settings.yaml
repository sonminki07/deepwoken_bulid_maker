gemini:
  model: "gemini-3.6-flash"
  embedding_model: "models/embedding-001"
  temperature: 0.1
  max_output_tokens: 8192

download:
  output_dir: "data/videos"
  format: "bestvideo[ext=mp4][filesize<?2G]+bestaudio[ext=m4a]/best[ext=mp4]/best"
  max_filesize_bytes: 2147483648 # 2GB
  cleanup_after_analysis: true

rag:
  db_path: "data/chromadb"
  collection_name: "deepwoken_builds"
  top_k: 4

paths:
  schema_path: "config/build_schema.json"
  analysis_prompt_path: "prompts/analysis_prompt.txt"
  analysis_dir: "data/analysis"
  knowledge_base_dir: "data/knowledge_base"
